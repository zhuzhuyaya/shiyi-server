server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: 123456

  application:
    name: shiyi-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shiyi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


sa-token:
  token-name: Authorization
  token-prefix: Bearer
  active-timeout: 2592000
  is-read-cookie: false
  is-concurrent: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: shiyi


es:
  endpoint: http://localhost:9200

shiyi:
  order:
    close-ttl-ms: 900000

langchain4j:
  ollama:
    base-url: http://localhost:11434

# 支付宝沙盒(第 12 课):APPID/私钥/支付宝公钥填你控制台里的真实值,私钥别提交公开仓库
alipay:
  app-id: 9021000158683012
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do   # 以沙箱控制台显示为准
  merchant-private-key: 
  alipay-public-key: 
  notify-url: http://localhost:8080/api/v1/pay/notify   # 本地够不着回调,靠主动查单兜底;有内网穿透再换公网地址
  return-url: http://localhost:5173/orders